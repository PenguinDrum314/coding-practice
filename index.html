<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>コーディング応用</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.css"
    />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand fs-4 fw-semibold" href="#">Casteria</a>
        <button
          class="navbar-toggler"
          type="button"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapse">
          <ul class="navbar-nav ms-auto mx-2 me-2 mb-lg-0">
            <li class="nav-item activ me-2">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item me-2">
              <a class="nav-link" href="#">Food</a>
            </li>
            <li class="nav-item me-2">
              <a class="nav-link" href="#">Drink</a>
            </li>
            <li class="nav-item me-2">
              <a class="nav-link" href="#">お問合せ</a>
            </li>
          </ul>
          <form class="d-flex justify-content-end" role="search">
            <input
              class="form-control"
              type="text"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <div class="slider">
      <div class="slider-img">
        <img src="img/interior.jpg" class="d-block w-100" alt="画像１" />
      </div>
      <div class="slider-img">
        <img src="img/restaurant.jpg" class="d-block w-100" alt="画像２" />
      </div>
      <div class="slider-img">
        <img src="img/restaurant2.jpg" class="d-block w-100" alt="画像３" />
      </div>
      <div class="slider-img">
        <img src="img/food.jpg" class="d-block w-100" alt="画像4" />
      </div>
      <div class="slider-img">
        <img src="img/food2.jpg" class="d-block w-100" alt="画像5" />
      </div>
    </div>

    <footer class="footer py-5 fixed-bottom">
      <ul class="d-flex justify-content-center">
        <li class="footer-item me-3">
          <a class="nav-link" href="#">プライバシー</a>
        </li>
        <li class="footer-item me-3">
          <a class="nav-link" href="#">お問合せ</a>
        </li>
        <li class="footer-item me-3">
          <a class="nav-link" href="#">運営会社</a>
        </li>
      </ul>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"
    ></script>
    <script src="main.js"></script>
    <script>
      $(function () {
        $(".navbar-toggler-icon").on("click", function () {
          $("#collapse").toggleClass("show");
        });
      });

      $(function () {
        $(".slider").slick({
          arrows: true,
          prevArrow: '<span class="prev-arrow"></span>',
          nextArrow: '<span class="next-arrow"></span>',
          autoplay: true,
          autoplaySpeed: 4000,
          dots: true,
          slidesToShow: 2,
          responsive: [
            {
              breakpoint: 768,
              settings: {
                slidesToShow: 1,
                slidesToScroll: 1,
              },
            },
          ],
        });
      });
    </script>
  </body>
</html>
